# Agent Hub — Production Docker Compose
#
# Usage: make docker-start (from project root)
#
# Services:
#   - nginx:    Reverse proxy (port 80, configurable via PORT)
#   - backend:  FastAPI application
#   - frontend: Vue 3 SPA
#   - db:       PostgreSQL 16
#   - redis:    Redis 7 (cache + SSE + working memory)
#
# Access: http://localhost:${PORT:-80}

services:
  # ── Database ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: agent-hub-db
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenthub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-agenthub}
    volumes:
      - agenthub_pg:/var/lib/postgresql/data
    ports:
      # Host port for local `make dev` (backend uses localhost, not Docker network).
      - "${AGENTHUB_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agent-hub-redis
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD} --appendonly yes --appendfsync everysec
    volumes:
      - agenthub_redis:/data
    ports:
      - "${AGENTHUB_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Backend: FastAPI ─────────────────────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: agent-hub-backend
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-agenthub}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      CORS_ORIGINS: '["http://localhost","http://localhost:${PORT:-80}"]'
    env_file:
      - ../.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Frontend: Vue 3 ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: /api
    container_name: agent-hub-frontend
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agent-hub
    restart: unless-stopped

  # ── One API ─────────────────────────────────────────────────────────
  # LLM API 管理 & 分发系统，统一管理所有模型调用
  one-api:
    build:
      context: ./one-api
      dockerfile: Dockerfile
    container_name: agent-hub-one-api
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      TZ: Asia/Shanghai
      SESSION_SECRET: ${ONE_API_SESSION_SECRET:-one-api-secret-change-me}
      SQLITE_PATH: /data/one-api.db
    volumes:
      - one-api-data:/data
    ports:
      - "${ONE_API_PORT:-3001}:3000"
    networks:
      - agent-hub
    restart: unless-stopped

  # ── 自部署服务 ─────────────────────────────────────────────────────────
  # 启动 one-api（已集成到主 compose 中，不依赖 agent-hub 其他服务）
  # 访问 http://localhost:3001，默认账号 root / 123456
  # 启动后在 .env 中设置 LLM_API_URL=http://one-api:3000/v1
  
  # Firecrawl: make docker-firecrawl（独立 compose，不依赖 agent-hub）
  # 启动后在 .env 中设置 FIRECRAWL_SELF_HOSTED_URL=http://localhost:3002

  # ── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agent-hub-nginx
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agent-hub
    restart: unless-stopped

volumes:
  agenthub_pg:
  agenthub_redis:
  one-api-data:

networks:
  agent-hub:
    driver: bridge
