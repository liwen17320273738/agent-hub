# Agent Hub — Server Deployment (reuses external PostgreSQL, Docker Redis)
#
# 适配方案：
#   - PostgreSQL: 复用宿主机上的 PG（通过 docker0 网桥 172.17.0.1 连接）
#   - Redis: Docker 内建（数据持久化到 named volume）
#
# Usage:
#   docker compose -f docker/docker-compose.server.yml up -d
#   docker compose -f docker/docker-compose.server.yml logs -f

services:
  # ── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agent-hub-redis
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env} --appendonly yes --appendfsync everysec
    volumes:
      - agenthub_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Backend: FastAPI ─────────────────────────────────────────────────────
  backend:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: agent-hub-backend
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # PostgreSQL on host — use docker0 bridge IP (172.17.0.1)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agenthub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@172.17.0.1:5432/${POSTGRES_DB:-agenthub}
      # Redis in Docker — same compose network
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a strong ADMIN_PASSWORD (min 12 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-'["http://47.95.254.24"]'}
    env_file:
      - ../.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Frontend: Vue 3 ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: /api
    container_name: agent-hub-frontend
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - agent-hub
    restart: unless-stopped

  # ── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: agent-hub-nginx
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - agent-hub
    restart: unless-stopped

volumes:
  agenthub_redis:

networks:
  agent-hub:
    driver: bridge
