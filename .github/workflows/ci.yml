name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AGENTHUB_TEST_MINIMAL_LIFESPAN: "1"
      AGENTHUB_SKIP_ENGINE_DISPOSE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e packages/agent-hub-pipeline
          pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  # ── Frontend Build ─────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Verify dist
        run: test -d dist && echo "dist/ exists — build OK" || (echo "dist/ missing!" && exit 1)

  # ── Frontend Tests ─────────────────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test

  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Lint backend
        run: ruff check backend/

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: |
          if grep -q '"lint"' package.json; then
            pnpm run lint
          else
            echo "No lint script found — skipping frontend lint"
          fi

  # ── Security Scan ───────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Scan backend for security issues
        run: bandit -r backend/ -ll -ii -f json -o bandit-report.json || true

      - name: Check bandit results
        run: |
          if [ -f bandit-report.json ]; then
            python3 -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          high = data.get('metrics', {}).get('_totals', {}).get('SEVERITY.HIGH', 0)
          med = data.get('metrics', {}).get('_totals', {}).get('SEVERITY.MEDIUM', 0)
          print(f'Security scan: {high} high, {med} medium severity issues')
          if high > 0:
              print('Failing due to high severity issues')
              exit(1)
          "
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: npm audit
        run: |
          npm audit --audit-level=high || echo "npm audit found issues (non-blocking for now)"

  # ── Docker Build (main only) ───────────────────────────────────────────────
  docker-build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
